[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mix-studio"
version = "0.2.0"
description = "Local-first desktop music mixing workstation with deterministic measurement tools (no AI)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
web = [
    "Flask>=3.0",
]

[project.scripts]
ai-mix-studio = "ai_mix_studio.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
